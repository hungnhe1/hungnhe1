<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cvcanhan.css">
    <title>Profile</title>
    <style>
        #project {
            padding: 40px 0;
            text-align: center;
        }

        .project-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .project-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .project-card {
            width: 300px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .project-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .project-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .project-card h3 {
            font-size: 18px;
            padding: 15px;
        }

        .project-link {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

<body>
    <header class="bgimg">
        <img src="image/background1.jpg" alt="Header Image">
        <div class="overlay"></div>
        <h1>Welcome to my website</h1>
    </header>

    <ul id="navbar">
        <li><a href="index.html">Profile</a></li>
        <li><a href="Career.html">Career</a></li>
        <li><a href="Project.html">Project</a></li>
        <li><a href="Contact.html">Contact</a></li>
    </ul>
    <h2 id="head">My Project</h2>
    <section id="project">

        <div class="project-container">

            <a href="https://hungnhe1.github.io/calculator.html" class="project-link"
                target="_blank">
                <div class="project-card">
                    <img src="image/calculatordemo.png" alt="Project 1">
                    <h3>Project 1: Calculator Simulation</h3>
                </div>
            </a>

            <a href="https://hungnhe1.github.io/hoca.html" class="project-link" target="_blank">
                <div class="project-card">
                    <img src="image/fishtankdemo.png" alt="Project 2">
                    <h3>Project 2: Aquarium Simulation</h3>
                </div>
            </a>
        </div>
    </section>


</body>

</html>
