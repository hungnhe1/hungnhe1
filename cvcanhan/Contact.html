    <title>Profile</title>
    <style>
        .contact-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .contact-box {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            transition: 0.3s ease;
        }

        .contact-box i {
            font-size: 35px;
            margin-bottom: 10px;
        }


        .contact-box:hover {
            transform: translateY(-8px) scale(1.05);
            color: white;
        }


        .fb:hover {
            background: #1877f2;
        }

        .discord:hover {
            background: #5865F2;
        }

        .twitter:hover {
            background: #1DA1F2;
        }

        .tiktok:hover {
            background: #000000;
        }
    </style>
</head>

        </a>

        <a href="https://discord.gg/ZGz63sPH" target="_blank" class="contact-box discord">
            <i class="fab fa-discord"></i>
            <span>Discord</span>
        </a>

        <a href="https://x.com/hungnhe1" target="_blank" class="contact-box twitter">
